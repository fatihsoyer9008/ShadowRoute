# Gölge Rota — Hetzner deploy (Caddy reverse-proxy arkasında)
# Kullanım (sunucuda /root/GolgeRota/ altında):
#   git pull && docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build:
      context: ../backend
    image: golgerota-api
    container_name: golgerota_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"      # yalnız localhost; dışarıya Caddy açıyor
    volumes:
      - burulas_cache:/app/app/data/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/routes')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  burulas_cache:
