# Gölge Rota — deploy (Caddy reverse-proxy arkasında)
# Kullanım (sunucuda /root/GolgeRota/ altında):
#   cp deploy/.env.example deploy/.env   # değerleri doldur (APP_PORT vb.)
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  api:
    build:
      context: ../backend
    image: golgerota-api
    container_name: golgerota_api
    restart: unless-stopped
    ports:
      # APP_PORT: deploy/.env'den okunur (yoksa 8010). Yalnız localhost; dışarıya Caddy açıyor.
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    volumes:
      - burulas_cache:/app/app/data/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/routes')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  burulas_cache:
